name: Build OpticBASIC RAM TZX

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/**"
      - "font/**"
      - "tools/make_ram_*"
      - "Makefile"
      - ".github/workflows/ram-tzx.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ram-tzx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Z80 assembler
        run: sudo apt-get update && sudo apt-get install -y pasmo
      - name: Build RAM image and self-booting TZX
        run: make ram
      - name: Inspect ROM restart conversion
        run: |
          if sed 's/;.*$//' build/opticos_ram.asm | grep -Ei '(^|[[:space:]])rst[[:space:]]+(\$[0-9a-f]+|[0-9]+)'; then
            echo "Unexpected ROM restart left in RAM source" >&2
            exit 1
          fi
      - name: Exercise the TZX block encoder
        run: python3 -m unittest discover -s tools -p 'test_ram_tzx.py'
      - name: Boot RAM OpticBASIC in headless Z80 rig
        run: python3 tools/rig/test_ram.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpticOS-RAM-TZX
          path: |
            build/OpticOS-RAM.tzx
            build/opticos_ram.bin
            build/opticos_ram.sym
          if-no-files-found: error

  release-tzx:
    name: Attach tested TZX to GitHub Release
    if: github.event_name == 'release'
    needs: ram-tzx
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested TZX build
        uses: actions/download-artifact@v4
        with:
          name: OpticOS-RAM-TZX
          path: release-assets
      - name: Upload TZX release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/OpticOS-RAM.tzx --clobber

  publish-ram-v1:
    name: Publish the first RAM/TZX release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[publish-ram-v1.0.0]')
    needs: ram-tzx
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated TZX
        uses: actions/download-artifact@v4
        with:
          name: OpticOS-RAM-TZX
          path: release-assets
      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          First RAM-resident OpticOS / OpticBASIC edition for a standard ZX Spectrum 48K.

          **Download:** OpticOS-RAM.tzx from the Assets section below.
          **Start:** Boot with the factory Sinclair 48K ROM, enter LOAD "", then play the TZX tape. Its BASIC autoloader loads the RAM executable at 24576 ($6000) and launches it.

          Derived from the original ROM-based OpticOS by Optica Technology Design (brixham99/OpticOS), adapted into a self-contained RAM program in this fork. The original 16K ROM build remains available in the source tree.

          **Testing:** Automated RAM boot, IM2 interrupt, BASIC input, PRINT, AUTO/RUN, NEW, TZX framing/checksums and native software tape round-trip passed in a headless Z80 rig. Physical ZX Spectrum and end-to-end stock-ROM TZX bootstrap have not yet been verified.

          **Limits:** 48K required; ordinary Sinclair BASIC/game-tape loading is not provided inside RAM OpticBASIC. Reset the machine to return to the Sinclair ROM.

          Source, build instructions, and credits: https://github.com/tuklusan/OpticOS
          EOF
      - name: Create v1.0.0 release and upload TZX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.0.0 release-assets/OpticOS-RAM.tzx \
            --target "$GITHUB_SHA" \
            --title "OpticOS RAM/TZX v1.0.0" \
            --notes-file release-notes.md
