name: VMS37 native IA-32 M89 one QEMU runner
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# Use the original single serialized QEMU runner, never two parallel VMS PCs.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated VMS37 branch
        uses: actions/checkout@v4
      - name: Install QEMU TCG
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 unzip
      - name: Verify and unpack tested M89 native source/build archive
        shell: bash
        run: |
          set -euo pipefail
          echo '7631f04979782b2fae1e5050a975406539ef2cff8172d3f66e8cd2a4ee8ca8b7  ci-vms37/vms37-native-x86-m89-current.zip' | sha256sum --check
          unzip -q ci-vms37/vms37-native-x86-m89-current.zip
          test -f vms37-native-x86-m89/vms37lab.ima
          test -f vms37-native-x86-m89/portdisk.img
          file vms37-native-x86-m89/build/sys.exe vms37-native-x86-m89/build/iniloa.exe
          readelf -l vms37-native-x86-m89/build/sys.exe
          readelf -l vms37-native-x86-m89/build/iniloa.exe
      - name: Boot one real IA-32 PC and require both Files-11 images
        shell: bash
        run: |
          set -euo pipefail
          cd vms37-native-x86-m89
          python3 tools/qemu_sysboot_m89.py
      - name: Preserve single QEMU COM1 transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m89-qemu-serial
          path: |
            vms37-native-x86-m89/qemu-m89-serial.log
          if-no-files-found: warn
