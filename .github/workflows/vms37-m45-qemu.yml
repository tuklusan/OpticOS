name: VMS37 M76 QEMU repeated guest stress
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# One executing workflow instance across all branches/attempts.
# GitHub queues later pushes rather than running two emulators at once.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Install QEMU TCG
        shell: bash
        run: |
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86

      - name: Reconstruct and verify native M76 floppy and Files-11 IDE disk
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout ci-vms37/vms37lab-m76.ima.xz > ci-vms37/vms37lab-m76.ima
          echo '9c0471e54062cf12b2ed8f573f40d04e354d80ba66ca46edb49d5b44ab024aa5  ci-vms37/vms37lab-m76.ima' | sha256sum --check
          xz --decompress --stdout ci-vms37/portdisk-m76.img.xz > ci-vms37/portdisk.img
          echo 'e38b443c7145e0a81d8d4fa9fa4a1cd37341448e62e075c3eb8c43d7a176524e  ci-vms37/portdisk.img' | sha256sum --check

      - name: Check native VMB BIOS memory handoff and SYSBOOT Files-11 boot
        shell: bash
        run: python3 ci-vms37/qemu_m76_startup.py

      - name: Preserve QEMU serial transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m76-qemu-serial
          path: |
            ci-vms37/qemu-m76-serial.log
          if-no-files-found: warn
