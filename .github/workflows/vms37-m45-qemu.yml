name: VMS37 M70 QEMU repeated guest stress
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# One executing workflow instance across all branches/attempts.
# GitHub queues later pushes rather than running two emulators at once.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Install QEMU TCG
        shell: bash
        run: |
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86

      - name: Reconstruct and verify exact M70 image, generate IDE test disk
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout ci-vms37/vms37lab-m70.ima.xz > ci-vms37/vms37lab-m70.ima
          echo '94f6be2c4f93e09e4654c35391150eed9ce15c65e77ba88f73b12c66b2c7e37d  ci-vms37/vms37lab-m70.ima' | sha256sum --check
          xz --decompress --stdout ci-vms37/portdisk-m68.img.xz > ci-vms37/portdisk.img
          echo '3ffffed461988f32de775e538734913b4c4b35b8afcbe218c610f4fd655db91e  ci-vms37/portdisk.img' | sha256sum --check

      - name: Check M70 single native SYSINIT boot path without development monitor
        shell: bash
        run: python3 ci-vms37/qemu_m70_startup.py

      - name: Preserve QEMU serial transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m70-qemu-serial
          path: |
            ci-vms37/qemu-m70-serial.log
          if-no-files-found: warn
