name: VMS37 M54 QEMU repeated guest stress
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# One executing workflow instance across all branches/attempts.
# GitHub queues later pushes rather than running two emulators at once.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Install QEMU TCG
        shell: bash
        run: |
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86

      - name: Reconstruct and verify exact M54 image, generate IDE test disk
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout ci-vms37/vms37lab-m54.ima.xz > ci-vms37/vms37lab-m54.ima
          echo 'dcbd01101be3d9a8f6b3c9a73069692f6b53c5e7390e07527f84d1c3376ba17a  ci-vms37/vms37lab-m54.ima' | sha256sum --check
          xz --decompress --stdout ci-vms37/portdisk-m54.img.xz > ci-vms37/portdisk.img
          echo 'ae86b6b2f3659ae27597233c944c4c0881484d5e38336c54c07656bf4fabe6f6  ci-vms37/portdisk.img' | sha256sum --check

      - name: Run M54 kernel 26 checks plus 76 stress commands
        shell: bash
        run: python3 ci-vms37/qemu_m45_smoke.py

      - name: Preserve QEMU serial transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m54-qemu-serial
          path: ci-vms37/qemu-m54-serial.log
          if-no-files-found: warn
