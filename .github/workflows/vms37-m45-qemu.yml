name: VMS37 M73 QEMU repeated guest stress
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# One executing workflow instance across all branches/attempts.
# GitHub queues later pushes rather than running two emulators at once.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Install QEMU TCG
        shell: bash
        run: |
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86

      - name: Reconstruct and verify native M73 floppy and Files-11 IDE disk
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout ci-vms37/vms37lab-m73.ima.xz > ci-vms37/vms37lab-m73.ima
          echo 'b053bd78ec47618409978c7c4962e7c43db022fcdb0ab4b99d5b5134adf26fd5  ci-vms37/vms37lab-m73.ima' | sha256sum --check
          xz --decompress --stdout ci-vms37/portdisk-m73.img.xz > ci-vms37/portdisk.img
          echo 'fa1ff3df48f7693b68fe88ad344f6f882c7b092aa04071b741d209e933a318ff  ci-vms37/portdisk.img' | sha256sum --check

      - name: Boot M73 using real Files-11 ODS-2 disk and assert SYSBOOT requires SYS.EXE
        shell: bash
        run: python3 ci-vms37/qemu_m73_startup.py

      - name: Preserve QEMU serial transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m73-qemu-serial
          path: |
            ci-vms37/qemu-m73-serial.log
          if-no-files-found: warn
