name: VMS37 native IA-32 M97 resident modified-page-writer map
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# Do not run OpticOS CI in this isolated VMS work branch.
# All VMS QEMU runs use the same one-at-a-time serialization key.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated VMS37 branch
        uses: actions/checkout@v4
      - name: Install one QEMU TCG PC runner
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 unzip
      - name: Rebuild pinned native source through M97
        shell: bash
        run: |
          set -euo pipefail
          echo '7631f04979782b2fae1e5050a975406539ef2cff8172d3f66e8cd2a4ee8ca8b7  ci-vms37/vms37-native-x86-m89-current.zip' | sha256sum --check
          unzip -q ci-vms37/vms37-native-x86-m89-current.zip
          cd vms37-native-x86-m89
          patch --batch -p1 < ../ci-vms37/m90-native.patch
          patch --batch -p1 < ../ci-vms37/m91-native.patch
          patch --batch -p1 < ../ci-vms37/m92-native.patch
          patch --batch -p1 < ../ci-vms37/m93-native.patch
          patch --batch -p1 < ../ci-vms37/m94-native.patch
          patch --batch -p1 < ../ci-vms37/m95-native.patch
          patch --batch -p1 < ../ci-vms37/m96-native.patch
          patch --batch -p1 < ../ci-vms37/m97-native.patch
          # Both Python tests now resolve INDEXF data/header LBNs dynamically.
          cp tests/test_sysloa386_disk_image.py tests/test_disk_image.py
          make -j2 all
          make bootcheck imagecheck sysnativecheck iniloacheck inicpbuscheck sysexecentrycheck sysloa386check sysloa386imagecheck
          make pktlayoutcheck packetqueuecheck inilockdbcheck iniprocveccheck iniphvswapcheck inimpwcheck files1186check files1187check
          python3 tools/gen_source_coverage.py
          python3 tests/test_source_audit.py
          readelf -l build/sys.exe
          readelf -l build/iniloa.exe
          readelf -l build/sysloa386.exe
      - name: Boot native IA-32 PC and verify resident SYS.EXE modified-page-writer record
        shell: bash
        run: |
          set -euo pipefail
          cd vms37-native-x86-m89
          python3 tools/qemu_sysboot_m97.py
      - name: Preserve actual guest COM1 transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m97-qemu-serial
          path: |
            vms37-native-x86-m89/qemu-m97-serial.log
          if-no-files-found: warn
