name: VMS37 M66 QEMU repeated guest stress
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# One executing workflow instance across all branches/attempts.
# GitHub queues later pushes rather than running two emulators at once.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Install QEMU TCG
        shell: bash
        run: |
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86

      - name: Reconstruct and verify exact M66 image, generate IDE test disk
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout ci-vms37/vms37lab-m66.ima.xz > ci-vms37/vms37lab-m66.ima
          echo 'd05915d14674d647e3fbd979cb7fd36789664cc2f4fd8088c0a9789af30c5766  ci-vms37/vms37lab-m66.ima' | sha256sum --check
          xz --decompress --stdout ci-vms37/portdisk-m66.img.xz > ci-vms37/portdisk.img
          echo 'b1e4f739b92c2db35605399ac3389ab1ce622a16360b3007158615470f0b8ee2  ci-vms37/portdisk.img' | sha256sum --check

      - name: Run M66 kernel 41 checks plus 76 stress commands and live login/DCL
        shell: bash
        run: python3 ci-vms37/qemu_m45_smoke.py

      - name: Preserve QEMU serial transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m66-qemu-serial
          path: ci-vms37/qemu-m66-serial.log
          if-no-files-found: warn
