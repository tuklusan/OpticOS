name: VMS37 native IA-32 M129 IOSUBPAGD LOG$TRANSLATE to source DQA0/NLA0 UCB
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# Do not run OpticOS CI in this isolated VMS work branch.
# All VMS QEMU runs use the same one-at-a-time serialization key.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated VMS37 branch
        uses: actions/checkout@v4
      - name: Install one QEMU TCG PC runner
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 unzip
      - name: Rebuild pinned native source through M129
        shell: bash
        run: |
          set -euo pipefail
          echo '7631f04979782b2fae1e5050a975406539ef2cff8172d3f66e8cd2a4ee8ca8b7  ci-vms37/vms37-native-x86-m89-current.zip' | sha256sum --check
          unzip -q ci-vms37/vms37-native-x86-m89-current.zip
          cd vms37-native-x86-m89
          patch --batch -p1 < ../ci-vms37/m90-native.patch
          patch --batch -p1 < ../ci-vms37/m91-native.patch
          patch --batch -p1 < ../ci-vms37/m92-native.patch
          patch --batch -p1 < ../ci-vms37/m93-native.patch
          patch --batch -p1 < ../ci-vms37/m94-native.patch
          patch --batch -p1 < ../ci-vms37/m95-native.patch
          patch --batch -p1 < ../ci-vms37/m96-native.patch
          patch --batch -p1 < ../ci-vms37/m97-native.patch
          patch --batch -p1 < ../ci-vms37/m98-native.patch
          patch --batch -p1 < ../ci-vms37/m99-native.patch
          patch --batch -p1 < ../ci-vms37/m100-native.patch
          patch --batch -p1 < ../ci-vms37/m101-native.patch
          patch --batch -p1 < ../ci-vms37/m102-native.patch
          patch --batch -p1 < ../ci-vms37/m103-native.patch
          patch --batch -p1 < ../ci-vms37/m104-native.patch
          patch --batch -p1 < ../ci-vms37/m105-native.patch
          patch --batch -p1 < ../ci-vms37/m106-native.patch
          patch --batch -p1 < ../ci-vms37/m107-native.patch
          patch --batch -p1 < ../ci-vms37/m108-native.patch
          patch --batch -p1 < ../ci-vms37/m109-native.patch
          patch --batch -p1 < ../ci-vms37/m110-native.patch
          patch --batch -p1 < ../ci-vms37/m111-native.patch
          patch --batch -p1 < ../ci-vms37/m112-native.patch
          patch --batch -p1 < ../ci-vms37/m113-native.patch
          patch --batch -p1 < ../ci-vms37/m114-native.patch
          patch --batch -p1 < ../ci-vms37/m115-native.patch
          patch --batch -p1 < ../ci-vms37/m116-native.patch
          patch --batch -p1 < ../ci-vms37/m117-native.patch
          patch --batch -p1 < ../ci-vms37/m118-native.patch
          patch --batch -p1 < ../ci-vms37/m119-native.patch
          patch --batch -p1 < ../ci-vms37/m120-native.patch
          patch --batch -p1 < ../ci-vms37/m121-native.patch
          patch --batch -p1 < ../ci-vms37/m122-native.patch
          patch --batch -p1 < ../ci-vms37/m123-native.patch
          patch --batch -p1 < ../ci-vms37/m124-native.patch
          patch --batch -p1 < ../ci-vms37/m125-native.patch
          patch --batch -p1 < ../ci-vms37/m126-native.patch
          patch --batch -p1 < ../ci-vms37/m127-native.patch
          patch --batch -p1 < ../ci-vms37/m128-native.patch
          patch --batch -p1 < ../ci-vms37/m129-native.patch
          # Both Python tests now resolve INDEXF data/header LBNs dynamically.
          cp tests/test_sysloa386_disk_image.py tests/test_disk_image.py
          # Replay the 46 exact SHA-256-verified current guest-layout fixtures, not stale M89 copies.
          python3 tools/m110_sync_test_fixtures.py
          make -j2 all
          make devlogcheck logsystemcheck inifindatabasecheck dqbootreadcheck dqfdtcheck swiopostcheck iopostendcheck nlddtcheck qiopostcheck iocphyscheck conportcheck inidevicedbcheck inidpttemplatecheck v37dyntagcheck inilogtemplatecheck inibootdevscancheck
          make rtl85check rtl107check rtl108check rtl109check rtl110check rtl111check rtl112check rtl113check sourcerangecheck m21bootcheck
          # Run the full historical guest-layout/host test suite, not only the modern smoke subset.
          make test
          make bootcheck imagecheck sysnativecheck sysnormalizedmapcheck iniloacheck inicpbuscheck sysexecentrycheck sysloa386check sysloa386imagecheck
          make inidptlistcheck inittydrvcheck inittybindcheck pktlayoutcheck packetqueuecheck inilockdbcheck iniprocveccheck iniphvswapcheck inimpwcheck inipflveccheck inisyswcbcheck inisyswcbdiskcheck inisyslogcheck files1186check files1187check
          python3 tools/gen_source_coverage.py
          python3 tests/test_source_audit.py
          python3 tests/test_disk_image.py
          python3 tests/test_sysloa386_disk_image.py
          readelf -l build/sys.exe
          readelf -l build/iniloa.exe
          readelf -l build/sysloa386.exe
      - name: Regress real QEMU M129 source IOC boot logical to physical lookup
        shell: bash
        run: |
          set -euo pipefail
          cd vms37-native-x86-m89
          python3 tools/qemu_sysboot_m129.py
      - name: Preserve actual guest COM1 transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m129-ci-m129-guest-serial
          path: |
            vms37-native-x86-m89/qemu-m129-serial.log
          if-no-files-found: warn
