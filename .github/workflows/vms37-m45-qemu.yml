name: VMS37 M68 QEMU repeated guest stress
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# One executing workflow instance across all branches/attempts.
# GitHub queues later pushes rather than running two emulators at once.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Install QEMU TCG
        shell: bash
        run: |
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86

      - name: Reconstruct and verify exact M68 image, generate IDE test disk
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout ci-vms37/vms37lab-m68.ima.xz > ci-vms37/vms37lab-m68.ima
          echo '7eee837dbcd033baad1a2bb0e7d6aced65cb26b91ae16dca7cbfded211e81b40  ci-vms37/vms37lab-m68.ima' | sha256sum --check
          xz --decompress --stdout ci-vms37/portdisk-m68.img.xz > ci-vms37/portdisk.img
          echo '3ffffed461988f32de775e538734913b4c4b35b8afcbe218c610f4fd655db91e  ci-vms37/portdisk.img' | sha256sum --check

      - name: Run M68 kernel 43 checks plus 76 stress commands and live login/DCL
        shell: bash
        run: python3 ci-vms37/qemu_m45_smoke.py

      - name: Preserve QEMU serial transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m68-qemu-serial
          path: |
            ci-vms37/qemu-m68-serial.log
            ci-vms37/vms37-m68-login.ppm
          if-no-files-found: warn
