name: VMS37 M74 QEMU repeated guest stress
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# One executing workflow instance across all branches/attempts.
# GitHub queues later pushes rather than running two emulators at once.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Install QEMU TCG
        shell: bash
        run: |
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86

      - name: Reconstruct and verify native M74 floppy and Files-11 IDE disk
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout ci-vms37/vms37lab-m74.ima.xz > ci-vms37/vms37lab-m74.ima
          echo 'dd0c523c139987f0536ab1a757feedd3572e2d1fec39edd58296dd32270a5847  ci-vms37/vms37lab-m74.ima' | sha256sum --check
          xz --decompress --stdout ci-vms37/portdisk-m74.img.xz > ci-vms37/portdisk.img
          echo 'ee019370f367b87f62bc1d88b834befe7e23f26518eb7b2910d33be7fd9b8400  ci-vms37/portdisk.img' | sha256sum --check

      - name: Boot with original Files-11 SYSEXE directory, then require SYS.EXE
        shell: bash
        run: python3 ci-vms37/qemu_m74_startup.py

      - name: Preserve QEMU serial transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m74-qemu-serial
          path: |
            ci-vms37/qemu-m74-serial.log
          if-no-files-found: warn
