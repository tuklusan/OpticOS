name: VMS37 M59 QEMU repeated guest stress
on:
  push:
    branches:
      - vms37-x86-qemu-m45-ci
  workflow_dispatch:

# One executing workflow instance across all branches/attempts.
# GitHub queues later pushes rather than running two emulators at once.
concurrency:
  group: vms37-native-x86-qemu-singleton
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Install QEMU TCG
        shell: bash
        run: |
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86

      - name: Reconstruct and verify exact M59 image, generate IDE test disk
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout ci-vms37/vms37lab-m59.ima.xz > ci-vms37/vms37lab-m59.ima
          echo '4f4f236f217bac414e42b0c61e1f3192cdbd71bc95d299753974a47725aa48bc  ci-vms37/vms37lab-m59.ima' | sha256sum --check
          xz --decompress --stdout ci-vms37/portdisk-m58-v37uaf.img.xz > ci-vms37/portdisk.img
          echo 'c70b6b93d3658ddf80886ff9f30383cfbffc6393a2e65668a16f3f55636f1e78  ci-vms37/portdisk.img' | sha256sum --check

      - name: Run M59 kernel 33 checks plus 76 stress commands
        shell: bash
        run: python3 ci-vms37/qemu_m45_smoke.py

      - name: Preserve QEMU serial transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vms37-m59-qemu-serial
          path: ci-vms37/qemu-m59-serial.log
          if-no-files-found: warn
